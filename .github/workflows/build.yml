name: Build Timoa

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust（GNU 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 安装 MinGW-w64 编译器
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: 把 MinGW 加入 PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # 优先用 action 输出的真实安装位置；为空时按候选路径兜底
          $loc = $env:MSYS2_LOCATION
          if ([string]::IsNullOrWhiteSpace($loc)) {
            foreach ($c in @("$env:RUNNER_TEMP\msys64", "$env:GITHUB_WORKSPACE\msys64", 'C:\msys64')) {
              if (Test-Path (Join-Path $c 'mingw64\bin\gcc.exe')) { $loc = $c; break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($loc)) { throw "未找到 MSYS2 安装位置" }
          $bin = Join-Path $loc.Trim() 'mingw64\bin'
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) { throw "gcc.exe not found at $bin" }
          Write-Host "MinGW bin directory: $bin"
          # MSYS2 原生自带 x86_64-w64-mingw32-gcc.exe 与 x86_64-w64-mingw32-windres.exe，
          # 不需要复制别名；只要把这个目录加入 PATH，
          # build.rs 嵌资源用的 windres 和链接用的 gcc 就都能找到
          Add-Content $env:GITHUB_PATH $bin

      - name: 编译
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Timoa-x64
          path: target/x86_64-pc-windows-gnu/release/*.exe
          if-no-files-found: error
