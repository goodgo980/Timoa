name: Build Timoa

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust（GNU 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 安装 MinGW-w64 编译器
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: 补齐 windres 别名并加入 PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # 定位 MSYS2 真实安装目录（新版 setup-msys2 装在临时目录，
          # 优先用 action 输出，为空时按候选路径兜底）
          $loc = $env:MSYS2_LOCATION
          if ([string]::IsNullOrWhiteSpace($loc)) {
            foreach ($c in @("$env:RUNNER_TEMP\msys64", "$env:GITHUB_WORKSPACE\msys64", 'C:\msys64')) {
              if (Test-Path (Join-Path $c 'mingw64\bin\gcc.exe')) { $loc = $c; break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($loc)) { throw "MSYS2 install location not found" }
          $bin = Join-Path $loc.Trim() 'mingw64\bin'
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) { throw "gcc.exe not found at $bin" }
          Write-Host "MinGW bin directory: $bin"
          # Timoa 的 build.rs 对 GNU 目标固定调用 x86_64-w64-mingw32-windres，
          # 而 MSYS2 只提供不带前缀的 windres.exe —— 补一个别名。
          # gcc 的带前缀版本 MSYS2 自带；用 Test-Path 守卫，已存在则跳过。
          foreach ($name in @('gcc', 'windres')) {
            $src = Join-Path $bin "$name.exe"
            $dst = Join-Path $bin "x86_64-w64-mingw32-$name.exe"
            if ((Test-Path $src) -and -not (Test-Path $dst)) {
              Copy-Item $src $dst -Force
              Write-Host "Created alias: $dst"
            } else {
              Write-Host "Skip (already exists or source missing): $dst"
            }
          }
          # 自检：build.rs 嵌资源必需的工具必须齐备
          if (-not (Test-Path (Join-Path $bin 'x86_64-w64-mingw32-windres.exe'))) {
            throw "windres alias missing at $bin"
          }
          Write-Host "windres alias OK"
          Add-Content $env:GITHUB_PATH $bin

      - name: 编译
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Timoa-x64
          path: target/x86_64-pc-windows-gnu/release/*.exe
          if-no-files-found: error
